# /etc/modprobe.d/rtc-bcm-options.conf
#
# Module parameters for rtc-bcm.
#
#   bus_num    — I2C adapter number (integer); corresponds to /dev/i2c-N
#   slave_addr — 7-bit I2C slave address (integer, hex notation accepted)
#
# Change these values to match your hardware configuration.
options rtc-bcm bus_num=2 slave_addr=0x46
